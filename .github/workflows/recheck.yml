name: independent recheck

# Re-checks the compiled environment with type checkers *other* than the one that
# built it.  `lake build` trusts Lean's own kernel and elaborator; these do not.
#
# This is the part of the audit that a plain build cannot give: it guards against a
# bug in Lean itself, and against declarations that reach the environment without
# full kernel checking (`unsafe`, `implemented_by`, `native_decide`).
#
# Both checkers are slow, so this runs on a schedule rather than per push.

on:
  schedule:
    - cron: "0 4 * * 1"   # Mondays, 04:00 UTC
  workflow_dispatch:

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      # leanchecker: replays the environment through Lean's kernel from scratch.
      # Bundled with the toolchain from v4.28.0-rc1 on; we pin v4.32.1, so the
      # bundled binary is used rather than a build of the external repository.
      #
      # nanoda: an independent Lean 4 type checker written in Rust — a genuinely
      # separate implementation, so it does not share Lean's kernel bugs.
      # `nanoda-allow-sorry: false` makes the presence of `sorryAx` anywhere in the
      # environment a failure, which is the environment-wide version of the
      # per-theorem axiom check in Formal/Statement.lean.
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          leanchecker: true
          nanoda: true
          nanoda-allow-sorry: false
