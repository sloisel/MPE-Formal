name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The runner ships ~14 GB free; mathlib's oleans are ~6.4 GB and the
      # toolchain ~2 GB, so reclaim preinstalled SDKs we do not use.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      # Installs the toolchain named in lean-toolchain, runs `lake exe cache get`
      # so mathlib's oleans are downloaded rather than rebuilt, then `lake build`.
      #
      # `lake build` is itself the audit: Formal/Statement.lean ends in a `run_cmd`
      # that throws unless each of the three theorems is self-contained and rests on
      # no axiom beyond propext/Classical.choice/Quot.sound.  That is what rules out
      # `sorryAx` — a `sorry` is otherwise only a warning and would not fail a build.
      #
      # `--wfail` turns warnings into errors.  That is the standard way to catch a
      # `sorry`, which is otherwise only a warning and would not fail a build, and it
      # keeps the tree warning-clean rather than letting linter noise accumulate.
      # Safe against mathlib's deprecation schedule only because mathlib is pinned by
      # commit in lake-manifest.json: a bump may surface new deprecations, and fixing
      # them is then part of the bump.
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build-args: "--wfail"
