name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The runner ships ~14 GB free; mathlib's oleans are ~6.4 GB and the
      # toolchain ~2 GB, so reclaim preinstalled SDKs we do not use.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      # Installs the toolchain named in lean-toolchain, runs `lake exe cache get`
      # so mathlib's oleans are downloaded rather than rebuilt, then `lake build`.
      #
      # `lake build` is itself the audit: Formal/Statement.lean ends in a `run_cmd`
      # that throws unless each of the three theorems is self-contained and rests on
      # no axiom beyond propext/Classical.choice/Quot.sound.  That is what rules out
      # `sorryAx` — a `sorry` is otherwise only a warning and would not fail a build.
      #
      # Deliberately no `build-args`.  `--wfail` would turn warnings into errors and
      # so also catch a `sorry`, but this build emits ~105 linter warnings (unused
      # variables, unused simp arguments), so it would fail on all of them; the
      # `run_cmd` catches holes without requiring a warning-clean tree.  Lake has no
      # `-j` in v4.32.1, so build parallelism is left at its default.
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true

      # The `run_cmd` covers everything the three theorems depend on.  This adds the
      # rest of the tree, which nothing in Statement.lean reaches.
      - name: No sorries anywhere
        run: |
          if grep -rn --include='*.lean' -E '(^|[^a-zA-Z_])sorry([^a-zA-Z_]|$)' Formal/ \
               | grep -v 'sorryAx'; then
            echo "::error::a sorry is present"
            exit 1
          fi
          echo "no sorries"
