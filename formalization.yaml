version: "v0.4"

project:
  name: "Local convergence of MPE and RRE for nonlinear fixed-point iterations"
  authors: ["Sébastien Loisel"]
  responsible_maintainers: ["Sébastien Loisel"]
  license: "MIT"

# What was formalized: the three probabilistic theorems of the author's own
# manuscript.  The results are new there; this formalization accompanies the
# manuscript rather than reproving literature.  The manuscript is under journal
# review and has no public identifier yet; this file will be updated with one
# when it exists.
sources:
  - title: "On the local convergence of minimal polynomial and reduced rank extrapolation for nonlinear fixed-point iterations"
    authors: ["Sébastien Loisel"]
    id: ""
    type: "article"
    location: "Theorems 4.7, 4.9 and 5.5"
    relationship: "formalizes"
    author_endorsement: "participated"
    note: >-
      Manuscript by the same author, submitted for publication in July 2026;
